<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NyayaSaathi AI — Understand Your Rights. Take the Right Action.</title>
    <meta name="description" content="NyayaSaathi AI simplifies government schemes, civic rights and legal information into clear, actionable steps." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet" />
    
    <!-- Dark Mode Initialization Script — runs before paint to avoid a light/dark flash.
         Priority: saved user preference -> system preference -> light (default). -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('nyayaSaathiTheme') || localStorage.getItem('theme');
          var theme = saved;
          if (theme !== 'light' && theme !== 'dark') {
            theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
          }
          if (theme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {
          // localStorage/matchMedia unavailable — default to light mode
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
